<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서예린의 은밀한 실험실</title>
<link rel="alternate" type="application/rss+xml" title="서예린의 은밀한 실험실 RSS" href="/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07050d;
  --bg2: #0f0b18;
  --bg3: rgba(24, 18, 38, 0.45);
  --line: rgba(200, 160, 232, 0.08);
  --line2: rgba(200, 160, 232, 0.2);
  --acc: #d4aff2;
  --acc2: #9d6bf3;
  --acc3: #ff7ebb;
  --text: #f0eaf8;
  --muted: #9587b0;
  --serif: 'Nanum Myeongjo', serif;
  --sans: 'Noto Sans KR', sans-serif;
  --neon-shadow: 0 0 15px rgba(157, 107, 243, 0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: radial-gradient(circle at 50% 0%, #1a1230 0%, var(--bg) 70%);
  color: var(--text);
  font-family: var(--sans);
  font-weight: 300;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 배경 그레인 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.5; pointer-events: none; z-index: 0;
}

/* 헤더 */
header {
  position: relative;
  border-bottom: 1px solid var(--line);
  padding: 0 clamp(20px, 5vw, 80px);
  z-index: 10;
  backdrop-filter: blur(12px);
  background: rgba(7, 5, 13, 0.7);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0;
}
.logo {
  font-family: var(--serif);
  font-size: clamp(16px, 2vw, 20px);
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
  text-decoration: none;
  text-shadow: var(--neon-shadow);
}
.logo span { color: var(--acc); }
.header-right { display: flex; align-items: center; gap: 16px; }
.rss-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 18px;
  border: 1px solid var(--acc2);
  border-radius: 40px;
  color: var(--acc);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  background: rgba(157, 107, 243, 0.05);
  cursor: pointer;
  box-shadow: var(--neon-shadow);
}
.rss-btn:hover {
  background: var(--acc2);
  color: #fff;
  box-shadow: 0 0 25px rgba(157, 107, 243, 0.4);
  transform: translateY(-2px);
}
.rss-btn svg { width: 13px; height: 13px; }

/* 히어로 */
.hero {
  position: relative;
  max-width: 1100px; margin: 0 auto;
  padding: clamp(60px, 10vw, 120px) clamp(20px, 5vw, 80px) clamp(40px, 6vw, 80px);
  z-index: 1;
}
.hero-label {
  font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--acc); margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
  font-weight: 500;
}
.hero-label::before {
  content: ''; display: block;
  width: 30px; height: 1px; background: var(--acc);
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(36px, 7vw, 76px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -0.03em;
  margin-bottom: 20px;
}
.hero h1 em {
  font-style: normal;
  -webkit-text-stroke: 1.5px var(--acc);
  color: transparent;
  text-shadow: 0 0 30px rgba(212, 175, 242, 0.2);
}
.hero-meta {
  display: flex; gap: 28px; flex-wrap: wrap;
  font-size: 13px; color: var(--muted);
  margin-top: 24px;
}
.hero-meta span { display: flex; align-items: center; gap: 6px; }
.hero-meta strong { color: var(--text); font-weight: 500; }

/* 장르 태그 */
.genre-bar {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 80px) 40px;
  display: flex; gap: 10px; flex-wrap: wrap;
}
.genre-tag {
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: 30px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  background: rgba(255, 255, 255, 0.02);
}
.genre-tag:hover, .genre-tag.active {
  border-color: var(--acc);
  color: var(--text);
  background: rgba(157, 107, 243, 0.15);
  box-shadow: 0 0 15px rgba(157, 107, 243, 0.2);
  transform: translateY(-1px);
}

/* 컨트롤 */
.controls {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 80px) 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.ctrl-left { display: flex; gap: 8px; }
.sort-btn {
  padding: 6px 16px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.01);
  color: var(--muted);
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 30px;
  letter-spacing: 0.03em;
}
.sort-btn.active, .sort-btn:hover {
  border-color: var(--line2);
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
}
.post-count { font-size: 13px; color: var(--muted); }

/* 3D 포스트 그리드 */
.grid-wrap {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 0 clamp(20px, 5vw, 80px);
  perspective: 1200px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 28px;
}

/* 3D 입체 카드 스타일 */
.post-card {
  background: var(--bg3);
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 16px;
  transition: box-shadow 0.3s ease, border-color 0.3s ease;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  color: inherit;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform-style: preserve-3d;
  transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px);
  will-change: transform, box-shadow;
}

.post-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(212, 175, 242, 0.12) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 1;
}
.post-card:hover::before {
  opacity: 1;
}

.post-card:hover {
  border-color: rgba(200, 160, 232, 0.25);
}

/* 카드 내부 요소 3D 깊이 설정 */
.card-thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
  transform: translateZ(25px);
  transform-style: preserve-3d;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
.card-thumb {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.9;
  transition: transform 0.4s, opacity 0.4s;
}
.post-card:hover .card-thumb {
  transform: scale(1.06) translateZ(10px);
  opacity: 1;
}

.card-series {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--acc); margin-bottom: 10px;
  transform: translateZ(15px);
  font-weight: 500;
}
.card-title {
  font-family: var(--serif);
  font-size: 18px; font-weight: 700;
  line-height: 1.4;
  margin-bottom: 12px;
  color: var(--text);
  word-break: keep-all;
  transform: translateZ(30px);
  transition: color 0.3s;
}
.post-card:hover .card-title {
  color: #fff;
}
.card-excerpt {
  font-size: 13px; color: var(--muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 20px;
  transform: translateZ(15px);
}
.card-meta {
  margin-top: auto;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--muted);
  transform: translateZ(20px);
  border-top: 1px solid rgba(255,255,255,0.03);
  padding-top: 14px;
}
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.card-tag {
  padding: 2px 8px;
  border: 1px solid var(--line);
  font-size: 10px;
  letter-spacing: 0.05em;
  color: var(--muted);
  border-radius: 4px;
  background: rgba(255,255,255,0.01);
}
.card-price {
  font-size: 12px;
  color: var(--acc3);
  font-weight: 700;
  text-shadow: 0 0 10px rgba(255, 126, 187, 0.2);
}

/* 로딩/에러 */
.state-msg {
  grid-column: 1 / -1;
  padding: 80px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.loader {
  display: inline-block;
  width: 28px; height: 28px;
  border: 2px solid var(--line);
  border-top-color: var(--acc);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 페이지네이션 */
.pagination {
  position: relative; z-index: 1;
  max-width: 1100px; margin: 0 auto;
  padding: 40px clamp(20px, 5vw, 80px);
  display: flex; justify-content: center; gap: 8px;
}
.page-btn {
  padding: 8px 20px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.01);
  color: var(--muted);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 30px;
}
.page-btn:hover, .page-btn.active {
  border-color: var(--acc);
  color: var(--acc);
  background: rgba(157, 107, 243, 0.1);
  box-shadow: var(--neon-shadow);
}
.page-btn:disabled { opacity: 0.2; cursor: default; }

/* 푸터 */
footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--line);
  padding: 36px clamp(20px, 5vw, 80px);
  text-align: center;
  background: rgba(7, 5, 13, 0.4);
}
footer .inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 24px;
  font-size: 12px; color: var(--muted);
}
footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
footer a:hover { color: var(--acc); }

/* 토스트 */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg2); border: 1px solid var(--acc2);
  color: var(--acc); padding: 12px 24px;
  font-size: 13px; border-radius: 40px;
  opacity: 0; transform: translateY(10px);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none; z-index: 100;
  box-shadow: 0 10px 30px rgba(157, 107, 243, 0.2);
}
#toast.show { opacity: 1; transform: translateY(0); }

/* 앰비언트 배경 시스템 */
.ambient-bg-container {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
  background: transparent;
}
.ambient-blob {
  position: absolute;
  width: 50vw;
  height: 50vw;
  min-width: 450px;
  min-height: 450px;
  background-size: cover;
  background-position: center;
  opacity: 0.18;
  filter: blur(5px) saturate(0.95);
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0) 70%);
  mask-image: radial-gradient(circle, rgba(0,0,0,1) 15%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0) 70%);
  will-change: transform;
}
.blob-1 {
  background-image: url('bg_series_main.jpg');
  top: -15%;
  left: -15%;
  animation: float-slow-1 32s ease-in-out infinite;
}
.blob-2 {
  background-image: url('bg_part1_body.jpg');
  top: 22%;
  right: -20%;
  animation: float-slow-2 38s ease-in-out infinite;
}
.blob-3 {
  background-image: url('bg_part1_end.jpg');
  bottom: 8%;
  left: -20%;
  animation: float-slow-3 35s ease-in-out infinite;
}
.blob-4 {
  background-image: url('bg_bed_sensual.jpg');
  bottom: -15%;
  right: -15%;
  animation: float-slow-4 42s ease-in-out infinite;
}

@keyframes float-slow-1 {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  33% { transform: translate(8%, 10%) rotate(5deg) scale(1.08); }
  66% { transform: translate(-6%, 12%) rotate(-4deg) scale(0.94); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes float-slow-2 {
  0% { transform: translate(0, 0) rotate(0deg) scale(1.06); }
  33% { transform: translate(-10%, 8%) rotate(-6deg) scale(0.92); }
  66% { transform: translate(8%, -6%) rotate(4deg) scale(1.08); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1.06); }
}
@keyframes float-slow-3 {
  0% { transform: translate(0, 0) rotate(0deg) scale(0.95); }
  50% { transform: translate(12%, -10%) rotate(8deg) scale(1.10); }
  100% { transform: translate(0, 0) rotate(0deg) scale(0.95); }
}
@keyframes float-slow-4 {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  50% { transform: translate(-12%, 12%) rotate(-5deg) scale(1.06); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; gap: 20px; }
  .hero-meta { gap: 16px; }
}
</style>
</head>
<body>

<div class="ambient-bg-container">
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>
  <div class="ambient-blob blob-3"></div>
  <div class="ambient-blob blob-4"></div>
</div>

<header>
  <div class="header-inner">
    <a href="/" class="logo">서예린의 <span>은밀한 실험실</span></a>
    <div class="header-right">
      <button class="rss-btn" onclick="copyRss()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 11a9 9 0 019 9M4 4a16 16 0 0116 16"/>
          <circle cx="5" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>
        RSS 구독
      </button>
      <a href="https://www.postype.com/@yasulfactory" target="_blank" class="rss-btn" style="border-color:var(--line);color:var(--muted);background:transparent;box-shadow:none">
        포스타입 ↗
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-label">실험실 채널</div>
  <h1>금기된<br><em>관능의</em> 서사</h1>
  <div class="hero-meta">
    <span>구독자 <strong id="subCount">—</strong></span>
    <span>포스트 <strong id="postCount">—</strong></span>
    <span>채널 <strong>@yasulfactory</strong></span>
  </div>
</section>

<div class="genre-bar" id="genreBar">
  <button class="genre-tag active" data-genre="">전체</button>
  <button class="genre-tag" data-genre="TS">TS·젠더스왑</button>
  <button class="genre-tag" data-genre="NTR">NTR</button>
  <button class="genre-tag" data-genre="조교">조교·지배</button>
  <button class="genre-tag" data-genre="판타지">판타지</button>
  <button class="genre-tag" data-genre="학원">학원</button>
  <button class="genre-tag" data-genre="금융">금융·피폐</button>
</div>

<div class="controls">
  <div class="ctrl-left">
    <button class="sort-btn active" data-sort="RECENT" onclick="setSort(this)">최신순</button>
    <button class="sort-btn" data-sort="POPULAR" onclick="setSort(this)">인기순</button>
  </div>
  <div class="post-count" id="countLabel">로딩 중...</div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <div class="state-msg"><div class="loader"></div><br>포스트 불러오는 중...</div>
  </div>
</div>

<div class="pagination" id="pagination"></div>

<footer>
  <div class="inner">
    <span>© 큐리스 / 서예린의 은밀한 실험실</span>
    <a href="/rss.xml">RSS 피드</a>
    <a href="https://www.postype.com/@yasulfactory" target="_blank">포스타입 채널</a>
    <a href="https://www.postype.com/@yasulfactory/membership" target="_blank">멤버십</a>
  </div>
</footer>

<div id="toast"></div>

<script>
const POSTYPE_BASE = 'https://www.postype.com/@yasulfactory';
let currentSort = 'RECENT';
let currentPage = 0;
let currentGenre = '';
let allPosts = [];

// 포스트 불러오기
async function loadPosts() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<div class="state-msg"><div class="loader"></div><br>포스트 불러오는 중...</div>';

  try {
    const res = await fetch(`/posts?size=100&sort=${currentSort === 'POPULAR' ? 'popular' : 'recent'}&page=${currentPage}`);
    const data = await res.json();

    console.log('[postype raw]', data.raw);

    allPosts = data.posts || [];
    renderPosts(allPosts);
    updateStats(data.raw);
  } catch(e) {
    grid.innerHTML = `<div class="state-msg">⚠️ 포스트를 불러오지 못했습니다<br><small style="color:var(--muted);margin-top:8px;display:block">${e.message}</small></div>`;
  }
}

function renderPosts(posts) {
  const grid = document.getElementById('grid');
  const countLabel = document.getElementById('countLabel');

  // 장르 필터링
  const filtered = currentGenre
    ? posts.filter(p => {
        const text = JSON.stringify(p).toLowerCase();
        return text.includes(currentGenre.toLowerCase());
      })
    : posts;

  countLabel.textContent = `총 ${filtered.length}개`;

  if (!filtered.length) {
    grid.innerHTML = '<div class="state-msg">해당 장르의 포스트가 없습니다</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => buildCard(p)).join('');
  
  // 3D 입체 틸트 효과 초기화
  init3dTilt();
}

function buildCard(p) {
  const url = `${POSTYPE_BASE}/post/${p.id}`;
  const title = p.title || '(제목 없음)';
  const excerpt = p.summary || p.excerpt || p.description || '';
  const series = p.series?.title || p.seriesTitle || '';
  const date = p.publishedAt
    ? new Date(p.publishedAt).toLocaleDateString('ko-KR', { year:'numeric', month:'short', day:'numeric' })
    : '';
  const price = p.price > 0 ? `${p.price.toLocaleString()}P` : '무료';
  const tags = (p.tags || []).slice(0, 3).map(t => `<span class="card-tag">${t}</span>`).join('');
  const thumb = p.thumbnail || p.coverImage || p.thumbnailUrl || '';
  const thumbHtml = thumb 
    ? `<div class="card-thumb-wrap"><img class="card-thumb" src="${thumb}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'"></div>` 
    : '';

  return `<a class="post-card" href="${url}" target="_blank" rel="noopener">
    ${thumbHtml}
    ${series ? `<div class="card-series">${series}</div>` : ''}
    <div class="card-title">${title}</div>
    ${excerpt ? `<div class="card-excerpt">${excerpt}</div>` : ''}
    <div class="card-meta">
      <div class="card-tags">${tags}</div>
      <div>
        <span class="card-price">${price}</span>
        ${date ? `<span style="margin-left:8px;font-size:11px;color:var(--muted)">${date}</span>` : ''}
      </div>
    </div>
  </a>`;
}

// 3D 마우스 틸트 인터랙션 함수
function init3dTilt() {
  const cards = document.querySelectorAll('.post-card');
  cards.forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // CSS 변수로 마우스 상대 위치 전달 (반사광 효과용)
      card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
      card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
      
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      
      // 최대 기울기 12도 정도로 계산
      const angleX = (yc - y) / 10;
      const angleY = (x - xc) / 10;
      
      card.style.transform = `perspective(1000px) rotateX(${angleX}deg) rotateY(${angleY}deg) translateZ(8px)`;
      card.style.boxShadow = `
        ${-angleY * 1.5}px ${angleX * 1.5}px 25px rgba(157, 107, 243, 0.15), 
        0 15px 35px rgba(0, 0, 0, 0.45)
      `;
    });
    
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
      card.style.boxShadow = 'none';
    });
  });
}

function updateStats(raw) {
  const sub = raw?.subscriberCount || raw?.channel?.subscriberCount;
  const total = raw?.totalCount || raw?.total;
  if (sub) document.getElementById('subCount').textContent = sub.toLocaleString() + '명';
  if (total) document.getElementById('postCount').textContent = total.toLocaleString() + '개';
}

function setSort(btn) {
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSort = btn.dataset.sort;
  currentPage = 0;
  loadPosts();
}

// 장르 필터
document.getElementById('genreBar').addEventListener('click', e => {
  const btn = e.target.closest('.genre-tag');
  if (!btn) return;
  document.querySelectorAll('.genre-tag').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentGenre = btn.dataset.genre;
  renderPosts(allPosts);
});

function copyRss() {
  const url = location.origin + '/rss.xml';
  navigator.clipboard.writeText(url).then(() => showToast('RSS 주소 복사됨: ' + url));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadPosts();
</script>
